name: Publish Weekly Classic Paper
# https://console.cron-job.org/dashboard
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "0 17 * * *"  # 매일 19:00 CEST (UTC+2) / 18:00 CET (UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN 모드 (실제 게시 없음)"
        type: boolean
        default: false
      main_model:
        description: "메인 모델"
        type: choice
        options:
          - claude-sonnet-4-6
          - claude-opus-4-1
          - claude-haiku-4-5-20251001
        default: claude-sonnet-4-6

concurrency:
  group: publish-classic-paper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - run: uv sync --frozen

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2
          restore-keys: hf-models-

      - name: Restore newsbot DB
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/newsbot.db
          key: newsbot-db-classic-${{ github.run_id }}
          restore-keys: newsbot-db-classic-

      - run: mkdir -p data

      - name: Run classic-paper pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          GITHUB_ARCHIVE_REPO_URL: "git@github.com:PythonToGo/ai-newsletter.git"
          GITHUB_ARCHIVE_BRANCH: "main"
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          PIPELINE_MODE: "classic_paper"
          ANALYSIS_MODE: "detail"
          ANTHROPIC_MAIN_MODEL: ${{ github.event.inputs.main_model || 'claude-sonnet-4-6' }}
          ANTHROPIC_QUALITY_MODEL: "claude-haiku-4-5-20251001"
          ITEMS_PER_CLASSIC: "2"
          CONTENT_TOPIC: "AI/ML"
          QUALITY_MIN_SCORE: "0.75"
          DEDUP_SIMILARITY_THRESHOLD: "0.92"
          DEFAULT_LANGUAGE: "ko"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LOG_LEVEL: "INFO"
        run: uv run python scripts/run_classic_paper.py
