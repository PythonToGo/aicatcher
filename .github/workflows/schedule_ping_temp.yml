name: Schedule Ping Temp

on:
  schedule:
    - cron: "30 21 * * *" # 23:30 CEST (UTC+2) — timezone 필드 미지원으로 UTC 직접 지정
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule context
        env:
          TZ: Europe/Berlin
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "berlin_time=$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "utc_time=$(env TZ=UTC date '+%Y-%m-%d %H:%M:%S %Z')"
