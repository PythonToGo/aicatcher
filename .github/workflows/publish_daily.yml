name: Publish Daily (X + GitHub Markdown Archive)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "7 6 * * *"   # 08:07 CEST
    - cron: "7 11 * * *"  # 13:07 CEST
    - cron: "45 21 * * *" # 23:45 CEST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN 모드로 실행 (실제 게시 없음)"
        type: boolean
        default: false
      analysis_mode:
        description: "LLM 분석 모드 (light=기본 저비용, detail=상세 분석)"
        type: choice
        options:
          - light
          - detail
        default: light
      main_model:
        description: "메인 Anthropic 모델 (scoring/analyzer/synthesizer)"
        type: choice
        options:
          - claude-sonnet-4-6
          - claude-sonnet-4-5
          - claude-haiku-4-5-20251001
          - claude-opus-4-1
        default: claude-sonnet-4-6
      quality_model:
        description: "품질 검사 Anthropic 모델"
        type: choice
        options:
          - claude-haiku-4-5-20251001
          - claude-sonnet-4-6
          - claude-sonnet-4-5
          - claude-opus-4-1
        default: claude-haiku-4-5-20251001

# 동시 실행 방지 — DB 캐시 충돌 방지 (ADR-002)
concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      # sentence-transformers 모델 캐시 (~80MB, 첫 실행만 다운로드)
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2
          restore-keys: hf-models-

      # newsbot.db 영속성 (ADR-002)
      # restore-keys로 항상 가장 최근 캐시를 복원
      - name: Restore newsbot DB
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: data/newsbot.db
          key: newsbot-db-${{ github.run_id }}
          restore-keys: newsbot-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
          GITHUB_ARCHIVE_REPO_URL: "git@github.com:PythonToGo/ai-newletter.git"
          GITHUB_ARCHIVE_BRANCH: "main"
          # workflow_dispatch dry_run 입력 우선, 없으면 false
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          CONTENT_TOPIC: "AI/ML"
          ITEMS_PER_REPORT: "6"
          QUALITY_MIN_SCORE: "0.8"
          DEDUP_SIMILARITY_THRESHOLD: "0.92"
          DEFAULT_LANGUAGE: "ko"
          ANALYSIS_MODE: ${{ github.event.inputs.analysis_mode || 'light' }}
          ANTHROPIC_MAIN_MODEL: ${{ github.event.inputs.main_model || 'claude-sonnet-4-6' }}
          ANTHROPIC_QUALITY_MODEL: ${{ github.event.inputs.quality_model || 'claude-haiku-4-5-20251001' }}
          LOG_LEVEL: "INFO"
        run: uv run python scripts/run_pipeline.py
