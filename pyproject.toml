[project]
name = "newsbot"
version = "0.1.0"
description = "AI/ML 트렌드 심층 분석 → X, Substack, WhatsApp 자동 배포 뉴스레터 봇"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "feedparser>=6.0.11",
    "praw>=7.8.1",
    "tweepy>=4.15.0",
    "sentence-transformers>=3.4.0",
    "numpy>=2.2.0",
    "pydantic-settings>=2.8.0",
    "lxml>=5.3.0",
]

[project.scripts]
run-pipeline = "newsbot.scripts.run_pipeline:main"
run-weekly = "newsbot.scripts.run_weekly:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
